name: Build Plugin Direct

on:
  push:
    branches: [ "master", "main", "Usta" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Fix Permissions & Build with Gradle
      run: |
        chmod +x gradlew
        ./gradlew jar --no-daemon

    - name: Upload Jar Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ActionButtonPlugin
        path: build/libs/*.jar
